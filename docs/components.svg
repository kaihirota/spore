<text x="244" y="102" text-anchor="middle" font-size="11.5" fill="#5d6875">HTTP</text>
<text x="524" y="412" text-anchor="middle" font-size="11.5" fill="#5d6875">model</text>
<text x="124" y="240" text-anchor="start" font-size="11.5" fill="#5d6875">git push</text>

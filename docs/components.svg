<text x="394" y="470" text-anchor="start" font-size="11.5" fill="#5d6875">one at a time</text>
<text x="394" y="584" text-anchor="start" font-size="11.5" fill="#5d6875">git push, only writer</text>
<text x="200" y="512" text-anchor="middle" font-size="11.5" fill="#5d6875">fetch fork</text>
<text x="524" y="222" text-anchor="middle" font-size="11.5" fill="#5d6875">live state</text>
<text x="640" y="305" text-anchor="end" font-size="11.5" fill="#5d6875">escalated</text>

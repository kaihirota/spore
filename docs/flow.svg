<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A conflict becomes queued work; only what no agent can settle reaches a person" font-family="Archivo, system-ui, sans-serif" font-size="13">
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a95a3"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1c2430">A conflict becomes queued work; only what no agent can settle reaches a person</text>
<g fill="none" stroke="#8a95a3" stroke-width="1.25"><path d="M182 110H206" marker-end="url(#flow)"/><path d="M372 110H404" marker-end="url(#flow)"/><path d="M534 110H566" marker-end="url(#flow)"/><path d="M470 150V214" marker-end="url(#flow)"/><path d="M388 240H324" marker-end="url(#flow)"/><path d="M260 216V136" marker-end="url(#flow)"/><path d="M470 264V324" marker-end="url(#flow)"/></g>
<rect x="18.0" y="86.0" width="164" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8a95a3" stroke-width="1.25"/>
<text x="100" y="114" text-anchor="middle" fill="#1c2430">Agent pushes to fork</text>
<text x="100" y="154" text-anchor="middle" font-size="11.5" fill="#5d6875">gets a reply at once</text>
<text x="100" y="170" text-anchor="middle" font-size="11.5" fill="#5d6875">and starts its next task</text>
<rect x="208.0" y="86.0" width="164" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8a95a3" stroke-width="1.25"/>
<text x="290" y="114" text-anchor="middle" fill="#1c2430">Merge and run tests</text>
<polygon points="406,110 470,70 534,110 470,150" fill="none" stroke="#8a95a3" stroke-width="1.25"/>
<text x="470" y="114" text-anchor="middle" fill="#1c2430">Clean + green?</text>
<rect x="568.0" y="86.0" width="164" height="48" rx="8" fill="#2f5fb3" fill-opacity="0.12" stroke="#2f5fb3" stroke-width="2"/>
<text x="650" y="114" text-anchor="middle" font-weight="600" fill="#1c2430">Trunk advances</text>
<rect x="388.0" y="216.0" width="164" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8a95a3" stroke-width="1.25"/>
<text x="470" y="244" text-anchor="middle" fill="#1c2430">Conflict queued</text>
<rect x="158.0" y="216.0" width="164" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8a95a3" stroke-width="1.25"/>
<text x="240" y="244" text-anchor="middle" fill="#1c2430">Resolver writes fix</text>
<rect x="388.0" y="326.0" width="164" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8a95a3" stroke-width="1.25"/>
<text x="470" y="354" text-anchor="middle" fill="#1c2430">Person picks a goal</text>
<text x="550" y="100" text-anchor="middle" font-size="11.5" fill="#5d6875">yes</text>
<text x="480" y="188" text-anchor="start" font-size="11.5" fill="#5d6875">no</text>
<text x="356" y="230" text-anchor="middle" font-size="11.5" fill="#5d6875">claims</text>
<text x="270" y="182" text-anchor="start" font-size="11.5" fill="#5d6875">fix takes the same path</text>
<text x="480" y="292" text-anchor="start" font-size="11.5" fill="#5d6875">contradicting goals,</text>
<text x="480" y="307" text-anchor="start" font-size="11.5" fill="#5d6875">or 2 failed fixes</text>
</svg>
